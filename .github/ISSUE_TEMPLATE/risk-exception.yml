name: XAGF Risk Exception
description: Request a time-bounded policy exception
title: "[XAGF EXCEPTION] "
labels: ["governance", "risk"]
body:
  - type: input
    id: control
    attributes:
      label: XAGF control ID
      placeholder: XAGF-...
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System ID
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk tier
      options: ["R0", "R1", "R2", "R3", "R4"]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and business justification
    validations:
      required: true
  - type: textarea
    id: compensating
    attributes:
      label: Compensating controls
    validations:
      required: true
  - type: input
    id: expiry
    attributes:
      label: Requested expiration date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: remediation
    attributes:
      label: Remediation plan
    validations:
      required: true
