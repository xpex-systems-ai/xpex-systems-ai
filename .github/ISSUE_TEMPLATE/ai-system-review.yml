name: AI System Governance Review
description: Register or re-assess an AI system under XAGF
title: "[XAGF] System review: "
labels: ["governance"]
body:
  - type: input
    id: system
    attributes:
      label: System ID / name
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Accountable owner
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Proposed risk tier
      options: ["R0", "R1", "R2", "R3", "R4"]
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose and users
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data classes and sources
      description: Use D0-D4 and identify important sources.
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: Models, agents, tools and connectors
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: External side effects / permissions
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and verification plan
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Open findings / blockers
