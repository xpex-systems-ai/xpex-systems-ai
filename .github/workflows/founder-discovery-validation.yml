name: Founder Discovery Validation

on:
  pull_request:
    paths:
      - "data/company/founder-discovery-profile-v1.json"
      - "docs/LINKEDIN_MASTER_PROFILE.md"
      - "docs/DISCOVERY_ENGINE.md"
      - "docs/FOUNDER_PROFILE.md"
      - "scripts/validate-founder-discovery.py"
  push:
    branches: [main]
    paths:
      - "data/company/founder-discovery-profile-v1.json"
      - "docs/LINKEDIN_MASTER_PROFILE.md"
      - "docs/DISCOVERY_ENGINE.md"
      - "docs/FOUNDER_PROFILE.md"
      - "scripts/validate-founder-discovery.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate founder discovery truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate founder discovery profile
        run: python scripts/validate-founder-discovery.py
