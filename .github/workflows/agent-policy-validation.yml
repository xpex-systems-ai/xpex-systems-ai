name: Agent Policy Validation
on:
  pull_request:
    paths: ["data/agents/**","schemas/agent-*.json","docs/governance/agent-governance.md","docs/governance/autonomy-levels.md","scripts/validate-agent-policy.py"]
  push:
    branches: [main]
    paths: ["data/agents/**","schemas/agent-*.json","docs/governance/agent-governance.md","docs/governance/autonomy-levels.md","scripts/validate-agent-policy.py"]
permissions:
  contents: read
jobs:
  validate:
    name: Validate governed agent permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/validate-agent-policy.py
