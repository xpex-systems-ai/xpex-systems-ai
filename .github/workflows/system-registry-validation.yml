name: System Registry Validation

on:
  pull_request:
    paths:
      - "systems/**"
      - "data/company/system-index-v1.json"
      - "data/company/company-graph-v1.json"
      - "schemas/system-registry-entry.schema.json"
      - "templates/system-onboarding/**"
      - "docs/SYSTEM_ONBOARDING.md"
      - "scripts/validate-system-registry.py"
  push:
    branches: [main]
    paths:
      - "systems/**"
      - "data/company/system-index-v1.json"
      - "data/company/company-graph-v1.json"
      - "schemas/system-registry-entry.schema.json"
      - "templates/system-onboarding/**"
      - "docs/SYSTEM_ONBOARDING.md"
      - "scripts/validate-system-registry.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate system registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/validate-system-registry.py
