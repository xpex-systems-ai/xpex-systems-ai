name: CodeQL Security Analysis

on:
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL / Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3 pinned
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3 pinned
        with:
          category: "/language:python"
