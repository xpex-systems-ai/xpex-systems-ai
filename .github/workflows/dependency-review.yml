name: Dependency Review Readiness

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref or commit to compare from"
        required: true
        default: "main"
        type: string
      head_ref:
        description: "Head ref or commit to compare against the base"
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    name: Dependency review (requires GitHub Dependency Graph)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_ref }}
          head-ref: ${{ inputs.head_ref }}
          fail-on-severity: high
          comment-summary-in-pr: never
