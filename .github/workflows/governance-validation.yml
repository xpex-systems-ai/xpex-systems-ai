name: Governance Validation

on:
  pull_request:
    paths:
      - "AI_GOVERNANCE_CHARTER.md"
      - "docs/governance/**"
      - "data/governance/**"
      - "schemas/**"
      - "scripts/validate-governance.py"
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - "AI_GOVERNANCE_CHARTER.md"
      - "docs/governance/**"
      - "data/governance/**"
      - "schemas/**"
      - "scripts/validate-governance.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate XAGF structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate governance artifacts
        run: python scripts/validate-governance.py
