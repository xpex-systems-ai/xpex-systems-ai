name: Governance Validation

on:
  pull_request:
    paths:
      - "AI_GOVERNANCE_CHARTER.md"
      - "docs/governance/**"
      - "data/governance/**"
      - "schemas/**"
      - "scripts/validate-governance.py"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "AI_GOVERNANCE_CHARTER.md"
      - "docs/governance/**"
      - "data/governance/**"
      - "schemas/**"
      - "scripts/validate-governance.py"
      - ".github/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate XAGF structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/validate-governance.py
