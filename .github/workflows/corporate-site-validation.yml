name: Corporate Site Validation

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/corporate-site-validation.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/corporate-site-validation.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build corporate site
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: "22"
      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Validate GX evidence boundary
        working-directory: site
        run: npm run test:gx && npm run test:gx-mcp && npm run test:launch && npm run test:enterprise-agent-api && npm run test:ecosystem
      - name: Build
        working-directory: site
        run: npm run build
