name: Workflow Supply Chain Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate-workflow-pinning.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/validate-workflow-pinning.py"

permissions:
  contents: read

jobs:
  pinning:
    name: Require immutable action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Validate workflow action pinning
        run: python scripts/validate-workflow-pinning.py
