name: Portfolio Registry Validation

on:
  pull_request:
    paths:
      - "data/company/portfolio-registry-v1.json"
      - "docs/PORTFOLIO.md"
      - "docs/DEMO_READINESS.md"
      - "docs/FOUNDER_PROFILE.md"
      - "scripts/validate-portfolio-registry.py"
  push:
    branches: [main]
    paths:
      - "data/company/portfolio-registry-v1.json"
      - "docs/PORTFOLIO.md"
      - "docs/DEMO_READINESS.md"
      - "docs/FOUNDER_PROFILE.md"
      - "scripts/validate-portfolio-registry.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio truth and flagship bounds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate portfolio registry
        run: python scripts/validate-portfolio-registry.py
